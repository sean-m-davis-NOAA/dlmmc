name: CPU validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          repository: Cosmo-Pop/affine
          ref: 5fdd3843b099a2386f75d97b6c059f64560afdf9
          path: .ci-affine
      - name: Apply the reviewed local adapter
        run: |
          python -c "import hashlib,json,pathlib; p=pathlib.Path('vendor'); m=json.loads((p/'affine-provenance.json').read_text()); assert hashlib.sha256((p/'affine-modernization.patch').read_bytes()).hexdigest()==m['patch_sha256']"
          git -C .ci-affine apply --check ../vendor/affine-modernization.patch
          git -C .ci-affine apply ../vendor/affine-modernization.patch
      - name: Install explicit CPU dependencies and local sampler
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './.ci-affine[torch,test]' -e '.[cpu,test,diagnostics]'
      - name: Fast CPU checks
        run: |
          python -m pytest tests -m 'not stan' -q
          python -m pytest .ci-affine/tests/test_torch.py .ci-affine/tests/test_torch_stream.py -q
      # Posterior/calibration/native hardware qualification is an explicitly
      # bounded separate job, never inferred from this deterministic CPU suite.
